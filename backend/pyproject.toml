[project]
name = "lifelink-backend"
version = "0.1.0"
description = "LifeLink backend: blood availability, discovery, donation and emergency coordination"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "unit: pure domain logic, no I/O",
    "integration: requires DynamoDB Local or moto",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately construct naive-free fixed datetimes via helpers.
"tests/**" = ["DTZ001"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
